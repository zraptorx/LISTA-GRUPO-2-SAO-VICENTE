<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de Presença – G2</title>
  <style>
    /* ESTILOS GERAIS */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 15px; background: #fff; color: #111; }
    h1 { font-size: 18px; margin: 0 0 10px 0; color: #2e7d32; text-align: center; }
    
    /* CONTROLES */
    button, select, input, textarea { padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; margin: 4px 0; background: #fff; }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: #f5f5f5; color: #333; }
    button.success { border-color: #2e7d32; color: #2e7d32; }
    button.success:hover { background: #e8f5e9; }

    /* LAYOUT */
    .topbar, .box { padding: 10px; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 2px; }
    .small { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; }
    textarea { width: 100%; min-height: 80px; resize: vertical; margin-top: 10px; }

    /* TABELA E COLUNA FIXA */
    .tableWrap { 
      width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; 
      border: 1px solid #ddd; border-radius: 8px; background: #fff; 
      max-height: 70vh; overflow-y: auto; position: relative; margin-bottom: 15px;
    }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    th, td { border-bottom: 1px solid #ddd; border-right: 1px solid #eee; padding: 8px 5px; text-align: center; white-space: nowrap; }
    
    /* Cabeçalhos Fixos */
    th { background: #f0f0f0; font-size: 11px; position: sticky; top: 0; z-index: 20; border-bottom: 2px solid #ccc; }
    
    /* Coluna de Nomes Fixa */
    th.nameHead, td.name {
      position: sticky; left: 0; background: #fff; 
      border-right: 2px solid #bbb; z-index: 30; 
      text-align: left; min-width: 200px; max-width: 200px;
      overflow: hidden; text-overflow: ellipsis;
    }
    th.nameHead { z-index: 40; background: #f0f0f0; }

    /* Cores e Status */
    td.name span { font-weight: 600; font-size: 13px; }
    .sun { background: #fffde7 !important; }
    .present { background: #c8e6c9 !important; color: #1b5e20; font-weight: bold; }
    
    .statusLine { padding: 10px; background: #e3f2fd; border-radius: 8px; margin-bottom: 15px; font-size: 12px; border: 1px solid #bbdefb; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 5px; }
    .dot.ok { background: #2e7d32; box-shadow: 0 0 5px #2e7d32; }
    .dot.error { background: #c62828; }

    .btn-del { border: none; background: none; color: #c62828; font-weight: bold; cursor: pointer; float: right; }
  </style>
</head>
<body>

<h1>📋 Presença G2</h1>

<div class="statusLine">
  <span id="dot" class="dot"></span>
  <span id="statusText">Iniciando sistema...</span>
</div>

<div class="box">
  <input type="text" id="newName" placeholder="Nome do membro..." style="flex:1; text-transform:uppercase;">
  <button id="btnAdd" class="primary" style="background:#333; color:#fff;">+ Add</button>
</div>

<div class="topbar">
  <div class="field"><div class="small">Mês</div><select id="month"></select></div>
  <div class="field"><div class="small">Ano</div><select id="year"></select></div>
  <div class="field"><div class="small">Dia</div><select id="daySelect"></select></div>
  <div class="field" style="flex:1"><div class="small">Buscar</div><input id="search" type="text" placeholder="Filtrar..."></div>
  <div class="field"><button id="btnPdf" class="primary">📄 PDF</button></div>
  <div class="field"><button id="btnBackup" class="success">💾 Backup</button></div>
  <div class="field"><button id="btnRestore" class="success" style="border:1px dashed #2e7d32">📂 Restaurar</button></div>
  <input type="file" id="fileRestore" style="display:none" accept=".json">
</div>

<div class="tableWrap">
  <table id="table"><tr><td style="padding:20px; text-align:center;">Carregando tabela...</td></tr></table>
</div>

<div class="box">
  <button id="btnGenerate" class="primary">📝 Gerar Texto</button>
  <button id="btnSendWa" class="success">📱 WhatsApp</button>
  <textarea id="waText" readonly placeholder="Texto para WhatsApp..."></textarea>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script type="module">
  // Configuração Exata do seu Projeto
  const firebaseConfig = {
    apiKey: "AIzaSyCM0nYBjOaHWKVjUm6PPpPjQ2MdAiqil0s",
    authDomain: "lista-grupo-2-sao-vicente.firebaseapp.com",
    projectId: "lista-grupo-2-sao-vicente",
    storageBucket: "lista-grupo-2-sao-vicente.appspot.com",
    messagingSenderId: "95897300612",
    appId: "1:95897300612:web:e18378220805a70061dcd1"
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // Elementos
  const els = {
    month: document.getElementById("month"),
    year: document.getElementById("year"),
    day: document.getElementById("daySelect"),
    table: document.getElementById("table"),
    search: document.getElementById("search"),
    waText: document.getElementById("waText"),
    dot: document.getElementById("dot"),
    status: document.getElementById("statusText")
  };

  const months = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  months.forEach((m,i)=> els.month.add(new Option(m,i)));
  els.month.value = new Date().getMonth();
  for(let y=2024; y<=2030; y++) els.year.add(new Option(y,y));
  els.year.value = new Date().getFullYear();

  let state = { people: [], marks: {}, db: null, mRef: null, pRef: null };

  // --- SISTEMA DE CONEXÃO COM DIAGNÓSTICO ---
  async function initSystem() {
    try {
      els.status.innerText = "Conectando ao Firebase...";
      const app = initializeApp(firebaseConfig);
      state.db = getFirestore(app);
      const auth = getAuth(app);

      // Tenta Autenticar
      await signInAnonymously(auth);

      onAuthStateChanged(auth, user => {
        if(user) {
          els.dot.className = "dot ok";
          els.status.innerText = "Online. Sincronizado.";
          els.status.style.color = "green";
          attachListeners();
        } else {
          throw new Error("Usuário desconectado.");
        }
      });

    } catch (error) {
      console.error(error);
      els.dot.className = "dot error";
      els.status.innerHTML = `<b>ERRO DE CONEXÃO:</b> ${error.message}<br>Verifique: 1.Auth Anônimo ativado? 2.Regras do Firestore públicas?`;
      els.status.style.color = "red";
    }
  }

  function attachListeners(){
    const y = els.year.value, m = Number(els.month.value), key = `${y}-${String(m+1).padStart(2,"0")}`;
    state.mRef = doc(state.db, "presencas_g2", key);
    state.pRef = doc(state.db, "presencas_g2_meta", "people");

    // Ouve Nomes
    onSnapshot(state.pRef, snap => {
      state.people = snap.exists() ? (snap.data().people || []) : [];
      render();
    }, err => handleErr(err));

    // Ouve Marcas
    onSnapshot(state.mRef, snap => {
      state.marks = snap.exists() ? (snap.data().marks || {}) : {};
      render();
      updateDays();
    }, err => handleErr(err));
  }

  function handleErr(err) {
    els.status.innerText = "Erro de Permissão (Rules). Veja o console.";
    els.dot.className = "dot error";
    console.error("FIREBASE ERROR:", err);
  }

  function updateDays() {
    const y = els.year.value, m = Number(els.month.value), d = new Date(y, m+1, 0).getDate();
    els.day.innerHTML = "";
    for(let i=1; i<=d; i++) els.day.add(new Option(i,i));
  }

  function render(){
    const y = Number(els.year.value), m = Number(els.month.value), days = new Date(y, m+1, 0).getDate();
    const q = els.search.value.toLowerCase();
    
    let h1 = `<thead><tr><th rowspan='2' class='nameHead'>NOME</th>`;
    let h2 = `<tr>`;
    
    for(let d=1; d<=days; d++){
      const isSun = new Date(y, m, d).getDay() === 0;
      if(isSun){
        h1 += `<th colspan='2' class='sun'>${d}<br><small>DOM</small></th>`;
        h2 += `<th class='sun'>E</th><th class='sun'>C</th>`;
      } else {
        h1 += `<th rowspan='2'>${d}</th>`;
      }
    }
    h1 += "</tr>" + h2 + "</tr></thead><tbody>";

    let body = "";
    state.people.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
      body += `<tr><td class="name"><span>${p.name}</span> <button class="btn-del" onclick="window.delP('${p.id}')">×</button></td>`;
      for(let d=1; d<=days; d++) {
        const isSun = new Date(y, m, d).getDay() === 0;
        if(isSun){
          body += mkCell(p.id, d, 'E', true) + mkCell(p.id, d, 'C', true);
        } else {
          body += mkCell(p.id, d, 'C', false);
        }
      }
      body += `</tr>`;
    });
    els.table.innerHTML = h1 + body + "</tbody>";
  }

  function mkCell(pid, d, type, sun) {
    const k = `${pid}-${d}-${type}`;
    const checked = state.marks[k];
    const cls = `day ${sun?'sun':''} ${checked?'present':''}`;
    return `<td class="${cls}" style="cursor:pointer" onclick="window.tog('${pid}',${d},'${type}')">${checked?'X':''}</td>`;
  }

  // --- AÇÕES GLOBAIS ---
  window.tog = async (pid, d, type) => {
    const k = `${pid}-${d}-${type}`;
    try {
      await setDoc(state.mRef, { marks: { [k]: state.marks[k] ? deleteField() : true } }, { merge: true });
    } catch(e) { alert("Erro ao salvar: Verifique sua internet ou permissões."); }
  };

  window.delP = async (id) => {
    if(confirm("Excluir nome?")) await setDoc(state.pRef, { people: state.people.filter(p=>p.id!==id) });
  };

  document.getElementById("btnAdd").onclick = async () => {
    const n = document.getElementById("newName").value.trim().toUpperCase();
    if(n) {
      const list = [...state.people, {id:"p"+Date.now(), name:n}].sort((a,b)=>a.name.localeCompare(b.name));
      await setDoc(state.pRef, { people: list });
      document.getElementById("newName").value = "";
    }
  };

  // Funções PDF/Backup mantidas (simplificadas para garantir funcionamento)
  document.getElementById("btnPdf").onclick = () => {
    const { jsPDF } = window.jspdf; const doc = new jsPDF('l','mm','a4');
    doc.autoTable({ html: '#table', styles:{fontSize:6}, theme:'grid' });
    doc.save('presenca.pdf');
  };

  document.getElementById("btnBackup").onclick = () => {
    const b = new Blob([JSON.stringify(state)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "backup.json"; a.click();
  };
  
  document.getElementById("btnRestore").onclick = () => document.getElementById("fileRestore").click();
  document.getElementById("fileRestore").onchange = e => {
    const r = new FileReader(); r.onload = async ev => {
      const d = JSON.parse(ev.target.result);
      if(confirm("Restaurar backup?")) {
        if(d.people) await setDoc(state.pRef, { people: d.people });
        if(d.marks) await setDoc(state.mRef, { marks: d.marks });
      }
    };
    r.readAsText(e.target.files[0]);
  };

  // Gerador de Texto e Eventos
  document.getElementById("btnGenerate").onclick = () => {
    const d = els.day.value, m = Number(els.month.value), y = els.year.value;
    const isSun = new Date(y, m, d).getDay() === 0;
    const pE = state.people.filter(p=>state.marks[`${p.id}-${d}-E`]).map(p=>p.name);
    const pC = state.people.filter(p=>state.marks[`${p.id}-${d}-C`]).map(p=>p.name);
    els.waText.value = `*DATA: ${d}/${m+1}/${y}*\n` + (isSun ? `EBD (${pE.length}):\n${pE.join('\n')}\n\nCULTO (${pC.length}):\n${pC.join('\n')}` : `TOTAL (${pC.length}):\n${pC.join('\n')}`);
  };
  
  document.getElementById("btnSendWa").onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent(els.waText.value)}`);

  els.month.onchange = els.year.onchange = attachListeners;
  els.search.oninput = render;

  initSystem();
</script>
</body>
</html>
